name: Windows build + unit tests

# Builds the Windows fork (node + CLI + pool) on MSVC and runs the no-external-
# deps unit test suite on every push/PR. This is the guardrail that catches
# "broke the Windows build" automatically - the thing that had to be done by
# hand when merging upstream asset_features (PR26).
#
# NOTE: first-run validation. The vendored-dependency bootstrap below mirrors
# the documented local build (config-jsoncpp.bat / config-libjson-rpc.bat +
# `nuget install boost`). If a step needs a tweak on the GitHub runner, adjust
# here - the final DigiAsset build itself is confirmed to compile on MSVC.

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout (with submodules - jsoncpp, libjson-rpc-cpp, googletest)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore Boost 1.82.0 headers (NuGet) -> packages/boost.1.82.0
        run: nuget install boost -Version 1.82.0 -OutputDirectory packages -NonInteractive

      # NOTE: there is deliberately no `vcpkg install curl openssl` step. It was here on
      # the assumption that libjson-rpc-cpp needs them, it failed on every single run this
      # workflow has ever had, and it is not actually required: config-libjson-rpc.bat -
      # the documented local build, which does work - configures that submodule with no
      # vcpkg toolchain and no curl or openssl at all. The final link uses this fork's
      # vendored stubs (WinHTTP curl, sqlite3.c, openssl stubs) regardless.

      - name: Build jsoncpp (vendored submodule)
        run: |
          cmake -S jsoncpp -B jsoncpp/build "-DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/jsoncpp/install" -DCMAKE_INSTALL_INCLUDEDIR=include/jsoncpp
          cmake --build jsoncpp/build --config Release --target install

      # The pinned upstream commit calls cmake_policy(SET CMP0042 OLD), which CMake 4.x
      # rejects outright, so this dependency cannot configure as-shipped. The patch lives
      # in patches/ and is normally applied by config-libjson-rpc.bat; apply it here too
      # rather than duplicating the fix, so CI and a local build stay in step.
      # git apply --check succeeds only when it is NOT yet applied, which makes this a
      # no-op on a tree that already has it.
      - name: Patch libjson-rpc-cpp for CMake 4.x
        shell: bash
        run: |
          cd libjson-rpc-cpp
          if git apply --check ../patches/libjson-rpc-cpp-cmp0042.patch 2>/dev/null; then
            git apply ../patches/libjson-rpc-cpp-cmp0042.patch
            echo "applied CMP0042 patch"
          else
            echo "CMP0042 patch already applied - skipping"
          fi

      - name: Build libjson-rpc-cpp (vendored submodule)
        run: |
          cmake -S libjson-rpc-cpp -B libjson-rpc-cpp/build "-DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/libjson-rpc-cpp/install" "-DCMAKE_PREFIX_PATH=${{ github.workspace }}/jsoncpp/install" -DHTTP_CLIENT=NO -DHTTP_SERVER=NO -DCOMPILE_TESTS=NO -DCOMPILE_EXAMPLES=NO
          cmake --build libjson-rpc-cpp/build --config Release --target install

      - name: Configure (node + CLI + pool + tests)
        run: cmake -S . -B build -DBUILD_TEST=ON

      - name: Build node + CLI + pool
        run: cmake --build build --config Release --target DigiAssetWindows DigiAssetWindows-cli DigiAssetPoolServer

      - name: Build unit tests
        run: cmake --build build --config Release --target Unit_Tests_run

      - name: Run unit tests (63 expected)
        working-directory: tests
        run: ../build/tests/Release/Unit_Tests_run.exe
